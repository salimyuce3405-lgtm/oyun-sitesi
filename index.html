<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Portalım - Ücretsiz Online Oyunlar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; }
        header {
            background-color: #1e293b;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ef4444;
        }
        .logo { font-size: 24px; font-weight: bold; color: #ef4444; letter-spacing: 1px; }
        .logo span { color: #ffffff; }
        .search-box input {
            padding: 8px 15px;
            border-radius: 20px;
            border: none;
            background: #334155;
            color: white;
            outline: none;
        }
        .categories {
            display: flex;
            gap: 10px;
            padding: 20px 5%;
            overflow-x: auto;
        }
        .cat-btn {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .cat-btn:hover, .cat-btn.active { background: #ef4444; color: white; border-color: #ef4444; }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding: 0 5% 50px 5%;
        }
        .game-card {
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }
        .game-card:hover { transform: translateY(-5px); border-color: #ef4444; }
        .game-thumb {
            width: 100%;
            height: 130px;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        .game-info { padding: 15px; }
        .game-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .game-desc { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
        .play-btn {
            display: block;
            text-align: center;
            background: #ef4444;
            color: white;
            padding: 8px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        .play-btn:hover { background: #dc2626; }
    </style>
</head>
<body>

    <header>
        <div class="logo">OYUN<span>PORTAL</span></div>
        <div class="search-box">
            <input type="text" placeholder="Oyun ara...">
        </div>
    </header>

    <div class="categories">
        <button class="cat-btn active">Tümü</button>
        <button class="cat-btn">Aksiyon</button>
        <button class="cat-btn">Yarış</button>
        <button class="cat-btn">Bulmaca</button>
        <button class="cat-btn">Spor</button>
    </div>

    <div class="games-grid">
        <div class="game-card">
            <div class="game-thumb">🏎️</div>
            <div class="game-info">
                <div class="game-title">Turbo Racing 3D</div>
                <div class="game-desc">Sokaklarda hız yap ve rakiplerini geride bırak!</div>
                <a href="#" class="play-btn">Oyna</a>
            </div>
        </div>
        <div class="game-card">
            <div class="game-thumb">🎯</div>
            <div class="game-info">
                <div class="game-title">Neon Sniper</div>
                <div class="game-desc">Hedefini al ve nişan alarak görevleri tamamla.</div>
                <a href="#" class="play-btn">Oyna</a>
            </div>
        </div>
        <div class="game-card">
            <div class="game-thumb">🧩</div>
            <div class="game-info">
                <div class="game-title">Cyber Puzzle</div>
                <div class="game-desc">Devreleri birleştir, sistemi eski haline getir.</div>
                <a href="#" class="play-btn">Oyna</a>
            </div>
        </div>
    </div>

</body>
</html>
