<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Portalım - Online Oyun & Sohbet</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; overflow-x: hidden; }
        
        /* Tam Ekran Giriş/Kayıt Duvarı (Modal Overlay) */
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); z-index: 99999; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .auth-card { background: #1e293b; width: 100%; max-width: 420px; padding: 40px; border-radius: 16px; border: 2px solid #ef4444; box-shadow: 0 15px 35px rgba(0,0,0,0.7); text-align: center; }
        .auth-card h2 { color: #ef4444; font-size: 28px; margin-bottom: 8px; }
        .auth-card p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .auth-inputs { display: flex; flex-direction: column; gap: 15px; }
        .auth-inputs input { width: 100%; padding: 14px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; outline: none; font-size: 15px; }
        .auth-inputs input:focus { border-color: #ef4444; }
        .auth-btn { width: 100%; padding: 14px; background: #ef4444; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: background 0.2s; margin-top: 5px; }
        .auth-btn:hover { background: #dc2626; }
        .switch-auth { background: none; border: none; color: #94a3b8; font-size: 13px; cursor: pointer; margin-top: 15px; text-decoration: underline; }
        .switch-auth:hover { color: #fff; }
        #auth-error { color: #f87171; font-size: 13px; margin-top: 12px; }

        /* Üst Menü */
        header { background: #1e293b; padding: 20px; text-align: center; border-bottom: 2px solid #ef4444; box-shadow: 0 4px 15px rgba(0,0,0,0.4); display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; }
        header h1 { color: #ef4444; font-size: 26px; letter-spacing: 1px; }
        .user-info { display: flex; align-items: center; gap: 15px; font-size: 14px; color: #cbd5e1; }
        .logout-link { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }

        /* Oyun Kartları Alanı */
        .game-container { max-width: 1100px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 25px; }
        .game-card { background: #1e293b; border-radius: 14px; padding: 20px; text-align: center; border: 1px solid #334155; transition: transform 0.2s, border-color 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
        .game-card:hover { transform: translateY(-5px); border-color: #ef4444; }
        .game-icon { font-size: 48px; margin-bottom: 10px; }
        .game-card h3 { font-size: 20px; margin-bottom: 8px; color: #fff; }
        .game-card p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        .play-btn { background: #ef4444; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; transition: background 0.2s; width: 100%; }
        .play-btn:hover { background: #dc2626; }

        /* Oyun Oynama Penceresi (Modal) */
        #game-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #1e293b; width: 100%; max-width: 900px; height: 80vh; border-radius: 14px; border: 2px solid #ef4444; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { background: #0f172a; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .close-btn { background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        #game-frame { width: 100%; height: 100%; border: none; background: #000; }

        /* Sağ Altta Sabit Canlı Sohbet Kutusu */
        #chat-box { position: fixed; bottom: 20px; right: 20px; z-index: 9998; background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 330px; box-shadow: 0 8px 25px rgba(0,0,0,0.6); overflow: hidden; display: none; }
        .chat-header { background: #ef4444; color: white; padding: 12px 15px; font-weight: bold; font-size: 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .chat-body { padding: 15px; }
        #chat-messages { height: 200px; overflow-y: auto; font-size: 13px; color: #e2e8f0; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; padding-right: 5px; }
        .msg-item { background: #0f172a; padding: 8px 10px; border-radius: 8px; border-left: 3px solid #ef4444; word-wrap: break-word; }
        .msg-sender { color: #ef4444; font-weight: bold; font-size: 11px; display: block; margin-bottom: 2px; }
        .chat-input-row { display: flex; gap: 6px; }
        .chat-input-row input { flex: 1; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; outline: none; font-size: 13px; }
        .chat-send-btn { width: 75px; background: #ef4444; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- TAM EKRAN GİRİŞ / KAYIT DUVARI -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2 id="auth-form-title">Giriş Yap</h2>
            <p id="auth-form-desc">Oynamak ve sohbet etmek için giriş yapmalısın.</p>
            
            <div class="auth-inputs">
                <input type="text" id="username" placeholder="Kullanıcı Adın">
                <input type="password" id="password" placeholder="Şifren (En az 6 karakter)">
                <button
