<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="İstediğin gibi **Slope** oyununu ve gönderdiğin kodun tamamını tek bir dosyada kusursuz bir şekilde birleştirdim Salim abi. 

Aşağıdaki kodun **hepsini kopyala**, bilgisayarındaki `index.html` dosyasının içindekilerin **tamamını silerek yerine yapıştır** ve kaydet (`Ctrl + S`):

```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Portalım</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; height: 100vh; overflow: hidden; }
        
        /* Tüm Ekranı Kaplayan Discord Tarzı Giriş/Kayıt Alanı */
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0f19; z-index: 99999; display: flex; justify-content: center; align-items: center; }
        .auth-card { background: #313338; width: 420px; padding: 32px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
        .auth-logo { font-size: 40px; margin-bottom: 10px; }
        .auth-title { color: #f2f3f5; font-size: 22px; font-weight: 600; margin-bottom: 6px; }
        .auth-subtitle { color: #949ba4; font-size: 14px; margin-bottom: 24px; }
        
        /* Sekme Butonları (Giriş Yap / Kayıt Ol) */
        .tab-buttons { display: flex; background: #1e1f22; border-radius: 4px; margin-bottom: 20px; padding: 4px; }
        .tab-btn { flex: 1; background: transparent; border: none; color: #949ba4; padding: 10px; font-weight: 600; cursor: pointer; border-radius: 4px; font-size: 14px; transition: 0.2s; }
        .tab-btn.active { background: #5865f2; color: white; }

        .input-group { text-align: left; margin-bottom: 18px; }
        .input-group label { display: block; color: #b5bac1; font-size: 12px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        .input-group input { width: 100%; padding: 10px 12px; background: #1e1f22; border: 1px solid #1f2023; color: #dbdee1; border-radius: 4px; outline: none; font-size: 15px; }
        .input-group input:focus { border-color: #5865f2; }
        
        .submit-btn { width: 100%; padding: 12px; background: #5865f2; color: white; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.2s; }
        .submit-btn:hover { background: #4752c4; }
        #auth-error { color: #f23f43; font-size: 13px; margin-top: 12px; }

        /* Ana Site İçeriği (Giriş Yapılınca Görünecek) */
        #main-content { display: none; height: 100vh; overflow-y: auto; padding-bottom: 80px; position: relative; }
        header { background: #1e293b; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #5865f2; }
        header h1 { color: #5865f2; font-size: 24px; }
        
        .header-right { display: flex; gap: 12px; align-items: center; }
        .chat-toggle-btn { background: #5865f2; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 14px; }
        .chat-toggle-btn:hover { background: #4752c4; }
        .logout-btn { background: #f23f43; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .logout-btn:hover { background: #d32f2f; }

        .game-container { max-width: 1100px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 25px; }
        .game-card { background: #1e293b; border-radius: 14px; padding: 20px; text-align: center; border: 1px solid #334155; display: flex; flex-direction: column; justify-content: space-between; }
        .game-icon { font-size: 48px; margin-bottom: 10px; }
        .game-card h3 { font-size: 20px; margin-bottom: 8px; color: #fff; }
        .game-card p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        .play-btn { background: #5865f2; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        .play-btn:hover { background: #4752c4; }

        /* Oyun Modalı */
        #game-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #1e293b; width: 100%; max-width: 900px; height: 80vh; border-radius: 14px; border: 2px solid #5865f2; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { background: #0f172a; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .close-btn { background: #f23f43; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        #game-frame { width: 100%; height: 100%; border: none; background: #000; }

        /* Discord Tarzı Açılır Sohbet Modalı */
        #chat-modal { display: none; position: fixed; bottom: 20px; right: 20px; width: 360px; height: 450px; background: #313338; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); z-index: 9999; flex-direction: column; overflow: hidden; border: 1px solid #1f2023; }
        .chat-modal-header { background: #2b2d31; color: #f2f3f5; padding: 14px; font-weight: bold; font-size: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2023; }
        .chat-modal-close { background: none; border: none; color: #949ba4; font-size: 18px; cursor: pointer; font-weight: bold; }
        .chat-modal-close:hover { color: #fff; }
        
        #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #313338; }
        .msg-item { background: #2b2d31; padding: 8px 12px; border-radius: 6px; word-wrap: break-word; }
        .msg-sender { color: #5865f2; font-weight: bold; font-size: 12px; display: block; margin-bottom: 3px; }
        .msg-text { color: #dbdee1; font-size: 14px; }
        
        .chat-modal-footer { padding: 12px; background: #2b2d31; display: flex; gap: 8px; border-top: 1px solid #1f2023; }
        .chat-modal-footer input { flex: 1; background: #383a40; border: none; padding: 10px; border-radius: 4px; color: white; outline: none; font-size: 14px; }
        .chat-modal-footer button { background: #5865f2; color: white; border: none; padding: 0 16px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .chat-modal-footer button:hover { background: #4752c4; }
    </style>
</head>
<body>

    <!-- DISCORD TARZI GİRİŞ / KAYIT EKRANI -->
    <div id="auth-overlay">
        <div class="auth-card">
            <div class="auth-logo">🎮</div>
            <div class="auth-title" id="card-title">Tekrar Hoş Geldin!</div>
            <div class="auth-subtitle" id="card-subtitle">Oynamak ve sohbet etmek için giriş yapmalısın.</div>

            <div class="tab-buttons">
                <button class="tab-btn active" id="login-tab" onclick="window.switchTab('login')">Giriş Yap</button>
                <button class="tab-btn" id="register-tab" onclick="window.switchTab('register')">Kayıt Ol</button>
            </div>

            <div class="input-group">
                <label>Kullanıcı Adı</label>
                <input type="text" id="username" placeholder="Kullanıcı adını gir">
            </div>
            
            <div class="input-group">
                <label>Şifre (En az 6 karakter)</label>
                <input type="password" id="password" placeholder="Şifreni gir" onkeypress="window.handleAuthKey(event)">
            </div>

            <button class="submit-btn" id="submit-btn" onclick="window.handleAuth()">Giriş Yap</button>
            <p id="auth-error"></p>
        </div>
    </div>

    <!-- ANA OYUN SİTESİ -->
    <div id="main-content">
        <header>
            <h1 id="welcome-title">🎮 OYUN PORT
